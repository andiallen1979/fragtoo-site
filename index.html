<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fragtoo — Gentoo Overlay Hub & Target Builds</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;max-width:960px;margin:2rem auto;padding:0 1rem;line-height:1.5}
h1,h2,h3{color:#58a6ff} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1.5rem 0}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1rem}
input,button{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:.5rem .75rem;font-size:.95rem}
input{width:100%;box-sizing:border-box;margin-bottom:.6rem} button{background:#238636;border-color:#2ea043;color:#fff;cursor:pointer;font-weight:600}
button.sec{background:#21262d;border-color:#30363d} code{background:#161b22;padding:.2rem .4rem;border-radius:4px;font-size:.88rem}
a{color:#58a6ff;text-decoration:none} .tag{font-size:.78rem;color:#8b949e;text-transform:uppercase}
</style>
</head>
<body>
<h1>Fragtoo & Gentool Ecosystem</h1>
<p>Community Gentoo overlay hub, Portage tooling, and hardware-targeted builds.</p>

<div class="grid" id="core"></div>

<h2>Community Overlay Directory (AUR-Style Hub)</h2>
<input id="q" placeholder="Search overlays by name, owner, or description..." oninput="render()">
<div id="list" class="grid"></div>

<h2>Register a Gentoo Overlay</h2>
<div class="card">
  <input id="rName" placeholder="Overlay name (must match profiles/repo_name, e.g. my-overlay)">
  <input id="rUri" placeholder="Git clone URI (https://github.com)">
  <input id="rDesc" placeholder="Short description">
  <input id="rOwner" placeholder="GitHub username">
  <button onclick="submitOverlay()">Submit via GitHub Issue</button>
</div>

<script>
const GH = "https://github.com" + "/andiallen1979/";
const CORE = [
  ["Steam Deck • znver2","Fragtoo","Custom Gentoo overlay, kernel configs, and Gamescope profiles.",GH+"Fragtoo"],
  ["Binhost • znver5","WakStab","Primary build host overlay with portable gentool-* suite and custom ebuilds.",GH+"WakStab"],
  ["Dev & QA Lab","WakStabDevLab","Bare-metal and QEMU development environment for overlays and kernels.",GH+"WakStabDevLab"],
  ["Motorola • arm64","Minsktoo","Experimental Gentoo aarch64 overlay and device kernel config.",GH+"Minsktoo"]
];
document.getElementById("core").innerHTML = CORE.map(([t,n,d,u])=>`<div class="card"><div class="tag">${t}</div><h3>${n}</h3><p>${d}</p><a href="${u}">${u} →</a></div>`).join("");

let overlays = [];
fetch("overlays.json").then(r=>r.json()).then(d=>{overlays=d.overlays||[];render();});

function render(){
  const term = document.getElementById("q").value.toLowerCase();
  const rows = overlays.filter(o=>`${o.name} ${o.owner} ${o.description}`.toLowerCase().includes(term));
  document.getElementById("list").innerHTML = rows.map(o=>`
    <div class="card">
      <div class="tag">owner: ${o.owner} • ${o.sync_type||"git"}</div>
      <h3>${o.name}</h3><p>${o.description}</p>
      <p><code>fragtoo-hub add ${o.name}</code></p>
      <button class="sec" onclick="navigator.clipboard.writeText('fragtoo-hub add ${o.name}')">Copy Command</button>
      <a style="margin-left:.75rem" href="${o.homepage||o.sync_uri}">Repo →</a>
    </div>`).join("") || "<p>No matching overlays found.</p>";
}

function submitOverlay(){
  const payload = {name:rName.value.trim(),description:rDesc.value.trim(),owner:rOwner.value.trim(),sync_type:"git",sync_uri:rUri.value.trim()};
  if(!payload.name || !payload.sync_uri) return alert("Name and Git URI are required.");
  const u = new URL(GH + "fragtoo-site/issues/new");
  u.searchParams.set("title", "Register overlay: " + payload.name);
  u.searchParams.set("body", "```json\n" + JSON.stringify(payload, null, 2) + "\n```");
  window.open(u.toString(), "_blank");
}
</script>
</body>
</html>
